name: Databricks Bundle Precheck

# 🚀 TRIGGER CONDITIONS: Wake up whenever code changes on dev or main
on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

# 🔐 ENVIRONMENT BINDING: Pull in the secrets we added to GitHub
env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  bundle_validation:
    name: Validate Asset Bundle Code
    runs-on: ubuntu-latest

    steps:
      # Step A: Clone your code onto the temporary GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install the official Databricks CLI onto the runner
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.2

      # Step C: The Ultimate Test—make sure no paths, typos, or indentation bugs exist!
      - name: Validate Bundle Configuration
        run: |
          databricks bundle validate